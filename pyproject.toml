[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmpredict"
version = "0.1.0"
description = "Paste/mortar property prediction and inverse mix design from a literature database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "scipy>=1.12",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
moo = ["pymoo>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
pmpredict = "pmpredict.cli:main"

[tool.setuptools.packages.find]
include = ["pmpredict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running validation tests"]
