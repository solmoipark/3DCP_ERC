# classes counted as "cement" for cement_share / pct_cement_mass conversion
cement_groups: [opc, csa, cac, cement_other]
# clinker-bearing groups for the clinker_fraction objective (weight per group)
clinker_weight: {opc: 1.0, csa: 0.0, cac: 0.0, cement_other: 0.5}
