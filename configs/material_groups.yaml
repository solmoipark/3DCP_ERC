# Canonical material_class (139 terms, vocab v1.2.2) -> ML group.
# family: powder | aggregate | admixture | fibre | activator | nano | water | other
# The class 'other' (and any unmapped class) takes its family from the component role.
# Group-level defaults: sg = specific gravity used for mass<->volume conversions,
# solid_content = % solids assumed for liquid admixtures when the paper does not report it.

group_defaults:
  # powder
  opc:               {family: powder, sg: 3.15}
  csa:               {family: powder, sg: 2.85}
  cac:               {family: powder, sg: 3.20}
  cement_other:      {family: powder, sg: 3.00}
  ggbfs:             {family: powder, sg: 2.90}
  fly_ash_f:         {family: powder, sg: 2.30}
  fly_ash_c:         {family: powder, sg: 2.60}
  silica_fume:       {family: powder, sg: 2.20}
  metakaolin:        {family: powder, sg: 2.60}
  calcined_clay:     {family: powder, sg: 2.60}
  limestone_powder:  {family: powder, sg: 2.70}
  quartz_powder:     {family: powder, sg: 2.65}
  inert_filler_other: {family: powder, sg: 2.70}
  gypsum_sulfate:    {family: powder, sg: 2.40}
  lime:              {family: powder, sg: 2.24}
  magnesia:          {family: powder, sg: 3.20}
  slag_other:        {family: powder, sg: 3.30}
  glass_powder:      {family: powder, sg: 2.50}
  natural_pozzolan:  {family: powder, sg: 2.40}
  ash_other:         {family: powder, sg: 2.20}
  recycled_powder:   {family: powder, sg: 2.50}
  industrial_residue: {family: powder, sg: 2.80}
  other_powder:      {family: powder, sg: 2.70}
  # aggregate
  natural_sand:      {family: aggregate, sg: 2.65}
  standard_sand:     {family: aggregate, sg: 2.65}
  silica_sand:       {family: aggregate, sg: 2.65}
  crushed_sand:      {family: aggregate, sg: 2.70}
  recycled_agg:      {family: aggregate, sg: 2.45}
  lightweight_agg:   {family: aggregate, sg: 1.00}
  glass_agg:         {family: aggregate, sg: 2.50}
  rubber:            {family: aggregate, sg: 1.10}
  other_agg:         {family: aggregate, sg: 2.65}
  # admixture
  sp_pce:            {family: admixture, sg: 1.05, solid_content: 30}
  sp_other:          {family: admixture, sg: 1.10, solid_content: 40}
  vma:               {family: admixture, sg: 1.30, solid_content: 100}
  clay_modifier:     {family: admixture, sg: 2.60, solid_content: 100}
  accelerator:       {family: admixture, sg: 1.30, solid_content: 100}
  retarder:          {family: admixture, sg: 1.20, solid_content: 100}
  sap:               {family: admixture, sg: 1.20, solid_content: 100}
  aea:               {family: admixture, sg: 1.02, solid_content: 100}
  defoamer:          {family: admixture, sg: 1.00, solid_content: 100}
  sra:               {family: admixture, sg: 1.00, solid_content: 100}
  expansive:         {family: admixture, sg: 3.00, solid_content: 100}
  polymer:           {family: admixture, sg: 1.05, solid_content: 50}
  water_repellent:   {family: admixture, sg: 1.00, solid_content: 100}
  other_admix:       {family: admixture, sg: 1.20, solid_content: 100}
  # fibre
  steel:             {family: fibre, sg: 7.85}
  pp:                {family: fibre, sg: 0.91}
  pe:                {family: fibre, sg: 0.97}
  pva:               {family: fibre, sg: 1.30}
  glass:             {family: fibre, sg: 2.60}
  basalt:            {family: fibre, sg: 2.65}
  carbon:            {family: fibre, sg: 1.80}
  natural:           {family: fibre, sg: 1.40}
  other_fibre:       {family: fibre, sg: 1.15}
  # activator
  naoh:              {family: activator, sg: 2.13}
  koh:               {family: activator, sg: 2.04}
  sodium_silicate:   {family: activator, sg: 1.40, solid_content: 40}
  potassium_silicate: {family: activator, sg: 1.40, solid_content: 40}
  sodium_carbonate:  {family: activator, sg: 2.54}
  sodium_sulfate:    {family: activator, sg: 2.66}
  other_activator:   {family: activator, sg: 2.00}
  # nano
  nano_silica:       {family: nano, sg: 2.20}
  nano_caco3:        {family: nano, sg: 2.70}
  nano_clay:         {family: nano, sg: 2.50}
  cnt:               {family: nano, sg: 1.80}
  graphene:          {family: nano, sg: 2.00}
  csh_seed:          {family: nano, sg: 1.10, solid_content: 20}
  nano_other:        {family: nano, sg: 3.00}
  # water / other
  water:             {family: water, sg: 1.00}
  other_other:       {family: other, sg: 2.00}

